server {
    listen 80;
    server_name localhost;

    # Don't advertise the nginx version
    server_tokens off;

    # Requests carry at most 5 MB; only the TV video upload below may send up to 300 MB.
    # (A large body costs the backend memory even when it is rejected.)
    client_max_body_size 5M;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Frontend React SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # A request for a file (a name with an extension) that doesn't exist is a 404, not the
        # app's page: only app routes such as /staff/queue fall back to index.html. Nested, so
        # these files keep the security headers below.
        location ~* \.[a-z0-9]+$ {
            try_files $uri =404;
        }

        # Security headers for the web app. Scripts, styles, fonts and images come only from
        # this site (fonts are bundled, no inline styles). TV videos, video embeds and the TV's
        # video-folder link may still use any web address: tighten media-src, frame-src and
        # connect-src once the offices' video sources are known.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' blob: data: http: https:; frame-src 'self' http: https:; connect-src 'self' http: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }

    # Backend Django API
    location /api/ {
        proxy_pass http://ctms-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # TV video upload: the one request that may be large
    location /api/staff/display-video/ {
        proxy_pass http://ctms-backend:8000/api/staff/display-video/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 300M;
    }

    # Django's admin is not exposed: it signs in with a password only, skipping two-factor
    # sign-in (and is off in the backend unless ENABLE_DJANGO_ADMIN is set).

    # Django Media Files (uploaded videos, documents)
    location /media/ {
        # Uploaded files are data, never web pages: no scripts, no type guessing
        add_header Content-Security-Policy "default-src 'none'; media-src 'self'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://ctms-backend:8000/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 300M;
    }

    # Django Static Files (served via WhiteNoise on backend)
    location /static/ {
        proxy_pass http://ctms-backend:8000/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
